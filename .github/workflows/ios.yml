name: iOS Build

on:
  push:
    branches: [ "**" ]
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-latest

    steps:
    - name: Kodu Cek
      uses: actions/checkout@v4

    - name: Java Kurulumu
      uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: '17'

    - name: Xcode Ayarla
      uses: maxim-lobanov/setup-xcode@v1
      with:
        xcode-version: 'latest-stable'

    - name: Calistirma Iznini Ver
      run: chmod +x gradlew

    - name: Xcode Simulator Derlemesi Yap
      run: |
        xcodebuild -project iosApp/iosApp.xcodeproj \
                   -scheme iosApp \
                   -sdk iphonesimulator \
                   -configuration Debug \
                   CODE_SIGNING_ALLOWED=NO \
                   BUILD_DIR=build

    - name: Ciktiyi Yukle
      uses: actions/upload-artifact@v4
      with:
        name: ios-simulasyon-çıktısı
        path: iosApp/build/Debug-iphonesimulator/